[project]
name = "paperpilot"
version = "0.0.0"
description = "Evidence-first research intelligence and scientific-reproducibility platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Application dependencies; each one is approved and recorded in progress.md.
dependencies = [
    "fastapi>=0.162",
    "pydantic>=2.14",
    "pydantic-settings>=2.11",
    "uvicorn>=0.54",
]

[dependency-groups]
# Tooling decided in progress.md §6.8 (OQ-014).
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
# Not built or published as a package yet.
package = false

[tool.ruff]
target-version = "py314"
# First-party code lives in backend/ (imported as `app`).
src = ["backend"]
# Python files only: ruff can also format code blocks in Markdown, and the
# planning documents must not be reformatted by tooling.
include = ["*.py", "*.pyi"]
# Vendored third-party skill code is not PaperPilot code; it is kept unmodified.
extend-exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Backend code is imported as `app` (backend/app).
pythonpath = ["backend"]
# The default run is unit tests only: fast and offline. Markers are applied by
# folder in tests/conftest.py. Run service tests with `-m integration`.
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not integration and not evaluation",
]
markers = [
    "integration: needs local services from compose.yaml (PostgreSQL and/or GROBID); excluded by default",
    "evaluation: evaluation-harness runs (Phase 4 onwards); excluded by default",
]

[tool.mypy]
python_version = "3.14"
strict = true
# Module names come from folder paths: backend/app -> `app`, tests/... -> `tests....`
# (needed because several test folders have a conftest.py).
mypy_path = "backend,."
explicit_package_bases = true
# Pydantic's official plugin: lets mypy understand settings filled from the environment.
plugins = ["pydantic.mypy"]
exclude = ['^\.claude/']
